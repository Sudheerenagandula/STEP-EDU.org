<nav class="nav-shell" [class.nav-scrolled]="isScrolled">

  <div class="container nav-inner">

    <div class="nav-left-group">

      <a class="nav-brand" routerLink="/" aria-label="STEP The Finishing School">
        <div class="nav-brand-icon">
          <img src="/Logo-1.png" alt="STEP Logo" class="nav-brand-img" onerror="this.style.display='none'" />
        </div>
        <div class="nav-brand-text">
          <span class="nav-brand-name">STEP</span>
          <span class="nav-brand-sep"></span>
          <span class="nav-brand-tagline">THE FINISHING SCHOOL</span>
        </div>
      </a>

      <div class="nav-pill-links" (mouseleave)="resetHighlight()">
        <span class="nav-highlight"
              [style.width.px]="highlightWidth"
              [style.transform]="'translateX(' + highlightX + 'px)'"
              [style.opacity]="highlightOpacity"></span>

        <a class="nav-pill-link" routerLink="/about" routerLinkActive="is-active"
           [routerLinkActiveOptions]="{ exact: true }" (mouseenter)="onLinkHover($event)" (click)="closeMenu()">
          <span>About</span>
        </a>

        <a class="nav-pill-link" routerLink="/courses" routerLinkActive="is-active"
           (mouseenter)="onLinkHover($event)" (click)="closeMenu()">
          <span>Courses</span>
        </a>

        <a class="nav-pill-link" routerLink="/testimonials" routerLinkActive="is-active"
           (mouseenter)="onLinkHover($event)" (click)="closeMenu()">
          <span>Testimonials</span>
        </a>
      </div>

    </div>

    <!-- DESKTOP RIGHT GROUP -->
    <div class="nav-right-group">

      <div class="nav-cta-group">

        <a class="nav-cta-btn" routerLink="/contact" (click)="closeMenu()">
          <span>Contact Us</span>
        </a>

        <a class="nav-arrow-btn" routerLink="/contact" (click)="closeMenu()" aria-label="Contact Us">
          <span class="nav-arrow-icon">→</span>
        </a>

      </div>

    </div>

    <!-- MOBILE: CTA pill + Hamburger grouped together -->
    <div class="nav-mobile-actions">

      <a class="nav-cta-btn-mobile" routerLink="/contact" (click)="closeMenu()">
        <span>Contact Us</span>
      </a>

      <button
        type="button"
        class="nav-toggler"
        [class.is-open]="menuOpen"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen"
        aria-label="Toggle navigation menu"
      >
        <span class="tog-line"></span>
        <span class="tog-line"></span>
        <span class="tog-line"></span>
      </button>

    </div>

    <!-- MOBILE MENU (links only) -->
    <ul class="nav-links-mobile" [class.nav-links-mobile--open]="menuOpen">

      <li>
        <a routerLink="/about" routerLinkActive="is-active"
           [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">About</a>
      </li>

      <li>
        <a routerLink="/courses" routerLinkActive="is-active" (click)="closeMenu()">Courses</a>
      </li>

      <li>
        <a routerLink="/testimonials" routerLinkActive="is-active" (click)="closeMenu()">Testimonials</a>
      </li>

    </ul>

  </div>

</nav>
